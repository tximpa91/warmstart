[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "warmstart"
version = "0.1.0"
description = "An evaluation-first synthetic support answer cache"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic==2.10.6", "uvicorn>=0.34,<1"]

[dependency-groups]
cloud = [
    "uv==0.12.3",
    "workers-py==1.17.8",
    "workers-runtime-sdk==1.9.4",
]
dev = [
    "httpx>=0.28,<1",
 "pytest>=8.3,<9",
 "pytest-asyncio>=0.25,<1",
 "ruff>=0.11,<1",
 "mypy>=1.15,<2",
 "detect-secrets==1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warmstart"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/warmstart"]
