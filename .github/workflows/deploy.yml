name: Owner-controlled deployment
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, pilot]
        required: true
      reviewed_sha:
        description: Full reviewed main commit SHA
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          test "$REVIEWED_SHA" = "$(git rev-parse HEAD)"
          test "${#REVIEWED_SHA}" = 40
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.3'
      - run: uv sync --frozen --group cloud
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: test -f pylock.toml && git ls-files --error-unmatch pylock.toml
      - run: uv run python tools/check.py
      - name: Validate pilot release evidence
        if: inputs.target == 'pilot'
        env:
          RELEASE_EVIDENCE_JSON: ${{ secrets.RELEASE_EVIDENCE_JSON }}
        run: |
          mkdir -p artifacts
          python -c 'import os,pathlib; pathlib.Path("artifacts/release.json").write_text(os.environ["RELEASE_EVIDENCE_JSON"])'
          uv run python tools/release_gate.py --evidence artifacts/release.json
      - name: Render reviewed deployment
        env:
          TARGET: ${{ inputs.target }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ACCESS_ISSUER: ${{ vars.ACCESS_ISSUER }}
          ACCESS_AUDIENCE: ${{ vars.ACCESS_AUDIENCE }}
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_GATEWAY_LOG_MODE: ${{ vars.AI_GATEWAY_LOG_MODE }}
        run: uv run python tools/deploy_config.py --environment "$TARGET"
      - run: uv run --group cloud python tools/build_worker.py
      - run: uv run --group cloud python tools/worker_smoke.py
      - run: git diff --exit-code -- pylock.toml
      - run: uv run python tools/seed_sql.py
      - name: Migrate, seed and deploy rebuilt source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          npx --no-install wrangler d1 migrations apply DB --remote --config "artifacts/wrangler.$TARGET.json"
          npx --no-install wrangler d1 execute DB --remote --config "artifacts/wrangler.$TARGET.json" --file artifacts/seed.sql
          npx --no-install wrangler deploy --config "artifacts/wrangler.$TARGET.json"
      - name: Verify authenticated bindings without paid inference
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          PILOT_URL: ${{ vars.PILOT_URL }}
        run: uv run python tools/live_smoke.py --url "$PILOT_URL"
